# Date format
date-format: "MMMM YYYY"

# Enable banner style title blocks
title-block-banner: "#234460"

sidebar: research

# Default for table of contents (right side, since the Research sidebar is on the left)
toc: true
toc-title: Contents
toc-location: right

# Default knitr options
execute:
  echo: false
  message: false
  warning: false

include-back-link: true

format:
  html:
    template-partials:
      - ../html/research/title-block.html
