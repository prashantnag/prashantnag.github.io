sidebar: researchinfuser
# Date format
date-format: "dddd, MMMM D, YYYY"

# Enable banner style title blocks
title-block-banner: "#234460"

# Add blog-post class to the banner header area
format:
  html:
    code-tools: true
    comments:
      giscus:
        repo: prashantnag/prashantnag.github.io
        repo-id: "R_kgDOQubQXg" 
        category: "Announcements"
        category-id: "DIC_kwDOQubQXs4C0mcm"
        mapping: "pathname"
        reactions-enabled: true
        loading: lazy
        theme: light


# Default for table of contents
toc: true
toc-title: Contents
toc-location: right

freeze: true

# Default knitr options
execute:
  echo: true
  message: true
  warning: true

# Author: set per post in each year folder's _metadata.yml (e.g. 2026/_metadata.yml),
# so pages like this landing page and Start Here show no author.
# (author: "" on a page does not hide it in Quarto 1.11; it merges with this default.)
